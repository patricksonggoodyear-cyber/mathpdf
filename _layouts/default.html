<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description | escape }}">
  <title>{{ page.title | default: site.title | escape }} · {{ site.title | escape }}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      line-height: 1.7;
    }
    header, main, footer {
      box-sizing: border-box;
      width: min(900px, 100%);
      margin: 0 auto;
      padding: 1rem 1.25rem;
    }
    header { border-bottom: 1px solid #8885; }
    header a { font-weight: 700; text-decoration: none; }
    main { min-height: 65vh; overflow-wrap: anywhere; }
    h1 { line-height: 1.35; }
    h2 { margin-top: 2rem; }
    a { text-underline-offset: 0.18em; }
    .intro, .note { color: #777; }
    .problem-list { list-style: none; padding: 0; }
    .problem-list li {
      display: flex;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 0;
      border-bottom: 1px solid #8883;
    }
    .problem-main { min-width: 0; }
    .problem-title { display: block; font-weight: 600; }
    .file-id { display: block; color: #777; font-size: 0.84rem; }
    .raw-link { flex: 0 0 auto; font-size: 0.9rem; }
    footer { border-top: 1px solid #8885; color: #777; font-size: 0.9rem; }
    pre, code { overflow-wrap: anywhere; white-space: pre-wrap; }
    @media (max-width: 520px) {
      .problem-list li { align-items: flex-start; gap: 0.5rem; }
      .raw-link { font-size: 0.82rem; }
    }
  </style>
</head>
<body>
  <header>
    <a href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    <span> · 面向 AI 的临时数学材料</span>
  </header>
  <main>
    <h1>{{ page.title | default: site.title | escape }}</h1>
    <div class="content">
      {{ content }}
    </div>
  </main>
  <footer>
    本站以 Markdown 原文为内容源；目录随当前文件自动生成。
  </footer>
</body>
</html>
